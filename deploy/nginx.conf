# Load balancer in front of the Zovia app containers (deploy/docker-compose.yml).
#
# - least_conn: each request goes to the container with the fewest open requests, so a slow
#   request never piles work onto one box.
# - Passive health checks: a container that keeps failing (20 errors in 5 s) is taken out for 5 s,
#   and a failed request is retried once on another container (only for safe, idempotent methods).
# - Edge rate limiting per client IP, before traffic reaches Node: bursts are absorbed, floods get
#   429 straight from nginx. The app adds per-user and per-route limits on top (Redis-backed).
# - Static assets and Next's image optimiser output are cached here for a year / a day.

worker_processes auto;
events {
  worker_connections 16384;
  multi_accept on;
}

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 10000;
  server_tokens off;
  client_max_body_size 12m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Docker's DNS, so `--scale app=N` changes are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Per-IP request rates. 20 r/s sustained for the API with bursts of 40; pages are more generous.
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=pages:20m rate=40r/s;
  # Booking and payment endpoints: 2 r/s per IP is far above what a person does.
  limit_req_zone $binary_remote_addr zone=booking:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=perip:20m;
  limit_req_status 429;
  limit_conn_status 429;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:50m max_size=2g inactive=7d use_temp_path=off;

  upstream zovia_app {
    zone zovia_app 64k;
    least_conn;
    server app:3000 resolve max_fails=20 fail_timeout=5s;
    # Reuse connections to the app, and drop idle ones BEFORE Node does (Node keeps them 65 s,
    # KEEP_ALIVE_TIMEOUT in the Dockerfile). Otherwise nginx sends a request on a socket Node just
    # closed, gets "upstream prematurely closed", marks the app down, and answers 502.
    keepalive 256;
    keepalive_timeout 60s;
    keepalive_requests 10000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80 reuseport backlog=65535;
    server_name _;

    limit_conn perip 100;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    # Overwrite (never append) the client address: the app's rate limiter trusts these headers.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    location = /api/v1/health {
      access_log off;
      proxy_pass http://zovia_app;
    }

    location ~ ^/api/v1/bookings {
      limit_req zone=booking burst=5 nodelay;
      # Retry only when the connection to a container failed (the booking never reached it).
      # nginx never re-sends a POST that was delivered, so a booking cannot be made twice.
      proxy_next_upstream error;
      proxy_pass http://zovia_app;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://zovia_app;
    }

    location /_next/static/ {
      proxy_cache static;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_pass http://zovia_app;
    }

    location /_next/image {
      proxy_cache static;
      proxy_cache_valid 200 1d;
      proxy_cache_use_stale error timeout updating;
      proxy_pass http://zovia_app;
    }

    location /images/ {
      proxy_cache static;
      proxy_cache_valid 200 7d;
      proxy_pass http://zovia_app;
    }

    location / {
      limit_req zone=pages burst=80 nodelay;
      proxy_pass http://zovia_app;
    }
  }
}
