<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f4ee;font-family:Arial,Helvetica,sans-serif;color:#16181a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:28px;">
      <tr>
        <td>
          <p style="margin:0 0 16px;font-size:20px;font-weight:700;">Zovia</p>
          <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;">Confirm your e-mail</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">Thanks for joining. Confirm your address to finish creating your account.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#c8f169;color:#16181a;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;">Confirm e-mail</a>
          </p>
          <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#5c6064;">Button not working? Copy this link into your browser:</p>
          <p style="margin:0 0 20px;font-size:13px;line-height:1.5;word-break:break-all;color:#5c6064;">{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#5c6064;">If you did not sign up, you can ignore this e-mail.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
