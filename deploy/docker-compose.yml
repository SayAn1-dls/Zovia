# Self-hosted production stack: nginx load balancer -> N identical app containers.
# All app containers share state through Supabase (Postgres) and Upstash Redis, never local disk,
# so you can run as many as the traffic needs:
#
#   cp .env.example .env.production   # fill in Supabase, Upstash, site URL
#   docker compose -f deploy/docker-compose.yml --env-file .env.production up -d --build --scale app=4
#
# Scale up or down at any time with `--scale app=N`; nginx re-resolves the app containers.
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    env_file: ../.env.production
    environment:
      # Requests one container works on at once before answering 503 + Retry-After.
      API_MAX_IN_FLIGHT: "256"
    restart: unless-stopped
    deploy:
      replicas: 4
      resources:
        limits: { cpus: "1.0", memory: 1g }
    expose: ["3000"]

  lb:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
